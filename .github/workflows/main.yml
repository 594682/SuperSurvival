name: Build Super Survival (Forge 1.20.1)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle 8.1.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.1.1'

      - name: Extract final project from project.b64
        run: |
          base64 -d project.b64 > project.zip
          unzip -o project.zip
          ls -la

      - name: Build Forge mod
        run: |
          set -o pipefail
          gradle --no-daemon clean build --stacktrace 2>&1 | tee build.log

      - name: Upload JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SuperSurvival-Forge-1.20.1-JAR
          path: build/libs/*.jar
          if-no-files-found: error

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: SuperSurvival-build-log
          path: build.log
          if-no-files-found: ignore
